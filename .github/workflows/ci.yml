name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Record the checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate version and runtime assets
        run: python3 scripts/check-release.py
      - name: Check JavaScript and shell syntax
        run: |
          for source in ./*.js; do node --check "$source"; done
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Build and verify the extension ZIP
        run: ./scripts/package.sh
      - name: Set up browser tests
        run: |
          python3 -m venv /tmp/jsner-tests
          /tmp/jsner-tests/bin/pip install -r requirements-dev.txt
          /tmp/jsner-tests/bin/python -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: /tmp/jsner-tests/bin/python tests/ui_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jsner-package-${{ steps.revision.outputs.sha }}
          path: dist/*
          if-no-files-found: error
