<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSner — Scan Results</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="results.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 8V5a2 2 0 0 1 2-2h3" />
          <path d="M16 3h3a2 2 0 0 1 2 2v3" />
          <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
          <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
          <circle cx="12" cy="12" r="3.5" />
        </svg>
        <div class="brand-text">
          <h1 class="brand-name">JSner</h1>
          <span class="brand-sub">Scan results</span>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="btn btn--secondary" id="exportAllBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11" /><path d="m7 10 5 5 5-5" /><path d="M5 20h14" /></svg>
          Export all
        </button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Theme: auto" title="Theme: auto">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="search-field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" /></svg>
        <input type="text" id="searchInput" class="input input--mono" placeholder="Filter endpoints…" spellcheck="false" aria-label="Filter endpoints" />
      </div>
      <div class="filter-row" role="group" aria-label="Filter by category">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="endpoints" type="button">Endpoints</button>
        <button class="filter-btn" data-filter="apis" type="button">APIs</button>
        <button class="filter-btn" data-filter="graphql" type="button">GraphQL</button>
        <button class="filter-btn" data-filter="config" type="button">Configuration</button>
      </div>
    </div>

    <div class="statsbar" aria-label="Result statistics">
      <div class="stat">
        <span class="stat-value" id="totalStat">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="apiStat">0</span>
        <span class="stat-label">APIs</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="graphqlStat">0</span>
        <span class="stat-label">GraphQL</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="configStat">0</span>
        <span class="stat-label">Configuration</span>
      </div>
    </div>

    <div class="results-topline">
      <h2 id="resultsHeading">Endpoints</h2>
    </div>

    <div class="results-container" id="resultsContainer"></div>

    <div class="empty-state" id="emptyState">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" /><path d="M9 11h4" /></svg>
      <h2>No results here</h2>
      <p>Scan a page from the extension popup, then come back — results land here automatically.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="results.js"></script>
</body>
</html>
